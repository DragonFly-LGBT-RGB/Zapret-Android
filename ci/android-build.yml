# Скопируйте этот файл в .github/workflows/android.yml — и GitHub соберёт APK автоматически.
# (агент не может сам создавать workflow-файлы: у токена нет права `workflows`)
name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build (устанавливает NDK/CMake, качает byedpi, hev-socks5-tunnel и nfqws)
        run: python3 build.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapretAndroid-debug-apk
          path: out/ZapretAndroid-debug.apk
          if-no-files-found: error
